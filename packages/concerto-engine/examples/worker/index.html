<meta charset="utf-8">
<title>concerto-core in a worker</title>
<pre id="out">validating in the worker...</pre>
<script type="module">
    import { validate } from './main.mjs';

    const model = `namespace org.example@1.0.0
concept Address {
  o String street
  o Integer number range=[1,]
}`;

    window.concertoWorker = { validate };
    const results = [
        await validate(model, { $class: 'org.example@1.0.0.Address', street: 'High Street', number: 1 }),
        await validate(model, { $class: 'org.example@1.0.0.Address', street: 'High Street', number: 0 }),
    ];
    document.getElementById('out').textContent = JSON.stringify(results, null, 2);
</script>
