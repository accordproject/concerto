name: Nightly fuzz safety net

# P2 (accordproject/concerto-rust#307), plan accordproject/concerto-rust#29 §2.5
# ("Differential fuzzing") and §4 (Phase 5, P5-05/accordproject/concerto-rust#76).
#
# Fuzz runs otherwise happen only on tasks that change Rust engine semantics,
# never at merge (maintainer decision 2026-09-27). This is the safety net that
# catches anything slipping between tasks: one fixed-seed, 100,000-case
# differential fuzz shard (migration/fuzz/bin/fuzz.js) against the migration
# integration branch, nightly plus on demand.
#
# bin/fuzz.js's own "unresolved divergence" count already excludes every
# maintainer-accepted, permanent divergence (lib/expected-divergences.js, the
# DV-* rows) — but this migration's fuzzing has also found a long tail of
# real engine gaps that are individually tracked by their own issue and not
# yet fixed (results/stage2/triage-clusters.json's `owners`), so gating on
# that count alone would fail every night for already-known reasons.
# bin/check-nightly.js clusters tonight's divergences by signature
# (lib/signature.js, same as bin/triage.js) and fails only on a cluster
# signature that is not already in the committed baseline
# (results/nightly-baseline/known-clusters.json) — i.e. only on something
# NEW. See migration/fuzz/README.md "CI: the nightly safety net".
#
# Schedule note: GitHub only fires `schedule` triggers from the workflow file
# on the repository's default branch. Until this branch merges to main, use
# "Run workflow" (workflow_dispatch) to exercise it; the cron entry activates
# automatically once merged.

on:
  schedule:
    # 03:17 UTC daily (an off-the-hour time so it doesn't queue behind every
    # other project's on-the-hour scheduled jobs).
    - cron: '17 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz-shard:
    name: Fuzz shard (100,000 cases)
    runs-on: ubuntu-latest
    # Budget (see migration/fuzz/README.md "CI: the nightly safety net"):
    # setup (checkout, engine build, npm installs, workspace build) is
    # normally under 15 minutes; the shard itself measured at roughly 90
    # cases/s in this task's verification run (batch size 1000), so 100,000
    # cases is about 20 minutes. 60 minutes leaves comfortable headroom
    # without risking a silent partial run on a slow day.
    timeout-minutes: 60

    steps:
      - name: git checkout (integration branch)
        uses: actions/checkout@v4
        with:
          ref: claude/tender-pascal-ocwf9q

      # concerto-core loads the Rust engine when it is imported, so the build
      # needs it first (accordproject/concerto-rust#259). Builds from the
      # pinned concerto-rust ref, the same ref every other CI job in this
      # repo uses (.github/actions/concerto-engine) — not concerto-rust's own
      # integration head, which is unpinned and can be red between tasks.
      - name: Build the Rust engine (concerto-wasm)
        id: engine
        uses: ./.github/actions/concerto-engine

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # The fuzz harness runs packages/concerto-core/src through ts-node
      # (CONCERTO_ENGINE=rust); ts-node's type checker needs the other
      # workspace packages' dist/*.d.ts already built, or it fails with
      # TS2307 on a fresh checkout (migration/oracle/bin/coverage.sh has the
      # full explanation).
      - name: Build workspace packages
        run: npm run build

      - name: Install the frozen TS reference
        working-directory: migration/oracle/reference
        run: npm ci

      - name: Install the fuzz harness
        working-directory: migration/fuzz
        run: npm ci

      - name: Compute today's run-seed
        id: seed
        run: |
          # Rotates daily so the shard samples a different slice of the
          # mutation space each night, while staying reproducible: anyone
          # can replay the same day's shard with the same --run-seed.
          SEED="$(date -u +%Y%m%d)"
          echo "run-seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "### Nightly fuzz shard" >> "$GITHUB_STEP_SUMMARY"
          echo "run-seed: \`$SEED\` (100,000 cases, batch size 1000)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the fuzz shard
        id: fuzz
        env:
          FIXTURES_DIR: ${{ github.workspace }}/migration/oracle/fixtures
          CONCERTO_ENGINE_MODULE: ${{ steps.engine.outputs.pkg-dir }}/concerto-engine.cjs
        run: |
          mkdir -p migration/fuzz/results/nightly
          node migration/fuzz/bin/fuzz.js \
            --count 100000 \
            --batch-size 1000 \
            --run-seed "${{ steps.seed.outputs.run-seed }}" \
            --out migration/fuzz/results/nightly/run.json \
            --divergences migration/fuzz/results/nightly/divergences.jsonl \
            --expected migration/fuzz/results/nightly/expected-divergences.jsonl \
            --harness-errors migration/fuzz/results/nightly/harness-errors.jsonl

      # Writes triage-clusters.json into the same results dir (so the
      # artifact below always carries it) without failing the step itself —
      # the dedicated failing step after the upload is what gates the job,
      # so the report is uploaded either way.
      - name: Cluster tonight's divergences against the baseline
        id: check
        if: always()
        run: |
          set +e
          node migration/fuzz/bin/check-nightly.js \
            --divergences migration/fuzz/results/nightly/divergences.jsonl \
            --baseline migration/fuzz/results/nightly-baseline/known-clusters.json \
            --out migration/fuzz/results/nightly/triage-clusters.json > /tmp/check-nightly.out 2>&1
          CODE=$?
          set -e
          cat /tmp/check-nightly.out
          cat /tmp/check-nightly.out >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then echo "new=1" >> "$GITHUB_OUTPUT"; else echo "new=0" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the cluster report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-${{ steps.seed.outputs.run-seed }}
          path: migration/fuzz/results/nightly/
          if-no-files-found: error
          retention-days: 30

      - name: Fail on new divergence clusters
        if: steps.check.outputs.new == '1'
        run: |
          echo "::error::new, unowned divergence cluster(s) — see the fuzz-nightly-${{ steps.seed.outputs.run-seed }} artifact's triage-clusters.json"
          exit 1
