name: Publish

on:
  release:
    types:
      - published

permissions:
  id-token: write  # Required for OIDC / npmjs publish
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish to npm
    if: ${{ github.repository_owner == 'accordproject' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      # Ensure npm 11.5.1 or later for trusted publishing
      - run: npm install -g npm@latest

      - run: npm ci

      - name: tag
        id: tag
        run: |
          node ./scripts/tag.js ${{ github.event.release.tag_name }}

      - name: bump version
        run: |
          node ./scripts/bump_version.js ${{ github.event.release.tag_name }}
          npm version --workspaces --include-workspace-root --no-git-tag-version --yes --exact ${{ github.event.release.tag_name }}

      # Build only after the version bump. The ESM build (esbuild) inlines each
      # package's package.json at build time, so building first shipped an ESM
      # build that reported the previous version (#1462).
      - run: npm run build --if-present

      - name: publish
        run: |
          # Gate the publish on the ESM output matching the version being
          # published, so a reordering of the steps above cannot ship a stale
          # build again.
          npm run test:esm
          npm publish --workspaces --access public ${{ steps.tag.outputs.tag }} 2>&1

      - name: Create PR to increment version
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          commit-message: 'chore(actions): publish ${{ github.event.release.tag_name }} to npm'
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: true
          branch: ap-publish-${{ github.event.release.tag_name }}
          delete-branch: true
          title: 'chore(actions): publish ${{ github.event.release.tag_name }} to npm'
          body: |
            # Increment Versions

            Update the package.json version numbers after publishing to NPM.
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
          draft: false
