name: Milestone fuzz check

# P2 (accordproject/concerto-rust#307), plan accordproject/concerto-rust#29 §2.5
# ("Differential fuzzing") and §4 (Phase 5, P5-05/accordproject/concerto-rust#76).
#
# Fuzz runs otherwise happen only on tasks that change Rust engine semantics,
# never at merge (maintainer decision 2026-09-27). Revised maintainer decision
# (2026-09-28, accordproject/concerto-rust#307 comment): fuzz runs at the end
# of key milestones or phases, not on a schedule — this workflow is that
# milestone step, dispatched by the coordinator (migration/COORDINATOR.md,
# "Milestone fuzz check") against the migration integration branch, never
# fired automatically.
#
# bin/fuzz.js's own "unresolved divergence" count already excludes every
# maintainer-accepted, permanent divergence (lib/expected-divergences.js, the
# DV-* rows) — but this migration's fuzzing has also found a long tail of
# real engine gaps that are individually tracked by their own issue and not
# yet fixed (results/stage2/triage-clusters.json's `owners`), so gating on
# that count alone would fail every dispatch for already-known reasons.
# bin/check-milestone.js clusters this run's divergences by signature
# (lib/signature.js, same as bin/triage.js) and fails only on a cluster
# signature that is not already in the committed baseline
# (results/milestone-baseline/known-clusters.json) — i.e. only on something
# NEW. See migration/fuzz/README.md "CI: the milestone fuzz check" and
# migration/COORDINATOR.md.
#
# Review fixes (P2 blocking findings):
# - The canonical oracle corpus (migration/oracle/fixtures/) is gitignored
#   and ships only as assets on draft releases in accordproject/concerto-rust
#   (oracle-corpus-p107-06aa375 plus the supplement
#   oracle-corpus-supplement-d842c0ab7). The "Download the canonical oracle
#   corpus" step below fetches, sha256-verifies and extracts both, then
#   rebuilds the derived CTO cache — see migration/fuzz/README.md "CI: the
#   milestone fuzz check" for the CONCERTO_RUST_ASSETS_TOKEN secret this
#   needs (DECISION NEEDED, unresolved — see this task's status comment on
#   accordproject/concerto-rust#307).
# - `run_seed` now defaults to `1`, the seed results/milestone-baseline/
#   known-clusters.json was captured from, not today's date: the earlier
#   date-based default made a green default-input dispatch unlikely (see
#   migration/fuzz/README.md for why) with no committed evidence any other
#   seed passes. Pass a different run_seed to deliberately sample new
#   mutation space; expect that to surface not-yet-triaged clusters.
# - bin/check-milestone.js now also fails when the run itself looks broken
#   (incomplete, or an abnormal harness-error rate) instead of reading a
#   missing/broken run as a clean pass — see its own header comment.
#
# KNOWN LIMITATION (unresolved, DECISION NEEDED — see status comment on
# accordproject/concerto-rust#307): GitHub only lists a workflow_dispatch
# workflow as dispatchable (UI or API) when the same workflow file path also
# exists, with a workflow_dispatch trigger, on the repository's default
# branch. This file exists only on claude/tender-pascal-ocwf9q; origin/main
# has no fuzz-milestone.yml. Until a (possibly inert) copy of this file is
# added to main, "dispatch this workflow against claude/tender-pascal-ocwf9q"
# is not actually possible through GitHub's UI or API, regardless of what
# this file's own content does.

on:
  workflow_dispatch:
    inputs:
      concerto_rust_ref:
        description: >-
          concerto-rust ref to build the engine from. Defaults to the same
          pinned ref every other job in this repo's CI uses
          (.github/actions/concerto-engine), not concerto-rust's own
          integration head, which carries no CI gate of its own and can be
          red between tasks. Pass the integration branch
          (claude/tender-pascal-ocwf9q) or a commit on it to fuzz against a
          specific milestone state instead.
        required: false
        default: '5498f61190c98172627046753f040447f62a0141'
      run_seed:
        description: >-
          Fixed seed for this shard (bin/fuzz.js --run-seed). Defaults to 1,
          the seed results/milestone-baseline/known-clusters.json was
          captured from, so a routine dispatch with the defaults compares
          against a run the baseline is actually known to cover. Pass a
          different seed to deliberately sample a different slice of the
          mutation space — expect that to surface divergence clusters not
          yet in the baseline, which need triage (see
          migration/fuzz/README.md) before the check will pass again for
          that seed. Leave empty to fall back to today's date (UTC,
          YYYYMMDD) instead of 1.
        required: false
        default: '1'
      case_count:
        description: 'Number of cases for the shard (bin/fuzz.js --count).'
        required: false
        default: '100000'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz-shard:
    name: Fuzz shard
    runs-on: ubuntu-latest
    # Budget (see migration/fuzz/README.md "CI: the milestone fuzz check"):
    # setup (checkouts, engine build, npm installs, workspace build) is
    # normally under 15 minutes; the shard itself measured at roughly 90
    # cases/s in this task's verification run (batch size 1000), so the
    # default 100,000 cases is about 20 minutes. 60 minutes leaves
    # comfortable headroom without risking a silent partial run on a slow
    # day. Lower case_count or split into parallel shards
    # (bin/run-shards.js's pattern) before raising the timeout.
    timeout-minutes: 60

    steps:
      - name: git checkout (integration branch)
        uses: actions/checkout@v4
        with:
          ref: claude/tender-pascal-ocwf9q

      # The canonical oracle corpus (migration/oracle/fixtures/) is
      # gitignored (migration/oracle/.gitignore: fixtures/) and ships only as
      # assets on draft releases in accordproject/concerto-rust, so it is
      # never present from the checkout above and must be fetched here —
      # without it, migration/fuzz/lib/seeds.js finds no usable seed
      # fixtures and bin/fuzz.js refuses to run ("no usable seed fixtures").
      # `gh release download` needs a token that can read draft releases in
      # a DIFFERENT repository; the default, repo-scoped GITHUB_TOKEN cannot
      # (see migration/fuzz/README.md "CI: the milestone fuzz check").
      # migration/ledger/ (which the oracle harness's owner-attribution
      # reads relative to the fixtures dir) is already present here since
      # this checkout is of claude/tender-pascal-ocwf9q itself.
      - name: Download the canonical oracle corpus (accordproject/concerto-rust)
        env:
          GH_TOKEN: ${{ secrets.CONCERTO_RUST_ASSETS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CONCERTO_RUST_ASSETS_TOKEN is not set. The canonical oracle corpus ships only as assets on draft releases in accordproject/concerto-rust, which this repository's default GITHUB_TOKEN cannot read cross-repo. A PAT with read access to accordproject/concerto-rust, stored here as the CONCERTO_RUST_ASSETS_TOKEN secret, is required — see migration/fuzz/README.md 'CI: the milestone fuzz check' and the DECISION NEEDED on accordproject/concerto-rust#307."
            exit 1
          fi
          mkdir -p /tmp/oracle-corpus/pin /tmp/oracle-corpus/supplement
          (cd /tmp/oracle-corpus/pin && gh release download oracle-corpus-p107-06aa375 -R accordproject/concerto-rust -p '*.tgz')
          (cd /tmp/oracle-corpus/supplement && gh release download oracle-corpus-supplement-d842c0ab7 -R accordproject/concerto-rust -p '*.tgz')
          PIN_TGZ="$(ls /tmp/oracle-corpus/pin/*.tgz)"
          SUPP_TGZ="$(ls /tmp/oracle-corpus/supplement/*.tgz)"
          echo "e8a2bf72c7775a2d45123dea7b6ff897823c74a108603f5412251ced2619fce1  $PIN_TGZ" | sha256sum -c -
          echo "e2f6a2145843aca294edaafa33afc0ddfa46a8f28e96082af0c9ef5bceec27be  $SUPP_TGZ" | sha256sum -c -
          tar xzf "$PIN_TGZ" -C "$GITHUB_WORKSPACE"
          tar xzf "$SUPP_TGZ" -C "$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE/migration/oracle/fixtures"
          test -d "$GITHUB_WORKSPACE/migration/oracle/fixtures/supplement"

      # concerto-core loads the Rust engine when it is imported, so the build
      # needs it first (accordproject/concerto-rust#259).
      #
      # Not ./.github/actions/concerto-engine directly: that composite action
      # hardcodes its concerto-rust ref, and this job needs the ref to be a
      # dispatch input (maintainer decision 2026-09-28). Its steps are
      # reproduced below with the input substituted in; keep this in sync
      # with .github/actions/concerto-engine's own steps if that changes.
      - name: Check out concerto-rust
        uses: actions/checkout@v4
        with:
          repository: accordproject/concerto-rust
          ref: ${{ inputs.concerto_rust_ref }}
          path: .concerto-rust

      - name: Move the checkout next to this repository
        run: |
          rm -rf "$GITHUB_WORKSPACE/../concerto-rust"
          mv "$GITHUB_WORKSPACE/.concerto-rust" "$GITHUB_WORKSPACE/../concerto-rust"

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # concerto-wasm pins wasm-bindgen = "=0.2.128"; the CLI must match exactly.
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Build concerto-wasm
        id: engine
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          cd "$GITHUB_WORKSPACE/../concerto-rust/concerto-wasm"
          npm ci
          npm run build
          test -f pkg/concerto-engine.cjs
          test -f pkg/concerto-engine.mjs
          echo "pkg-dir=$(pwd)/pkg" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # The fuzz harness runs packages/concerto-core/src through ts-node
      # (CONCERTO_ENGINE=rust); ts-node's type checker needs the other
      # workspace packages' dist/*.d.ts already built, or it fails with
      # TS2307 on a fresh checkout (migration/oracle/bin/coverage.sh has the
      # full explanation).
      - name: Build workspace packages
        run: npm run build

      - name: Install the frozen TS reference
        working-directory: migration/oracle/reference
        run: npm ci

      # The CTO cache next to the corpus is DERIVED and must match
      # migration/oracle/bin/build-cto-cache.js (P2-09b,
      # accordproject/concerto-rust#153) — the tarballs' own cto-cache/ is
      # stale relative to this checkout's script and shows about 89 false
      # addModel/updateExternalModels regressions if left unrebuilt (see
      # migration/COORDINATOR.md "Oracle CTO cache"). Never rebuild or
      # re-record fixtures/ itself here — only the cache.
      - name: Rebuild the CTO cache
        run: node migration/oracle/bin/build-cto-cache.js

      - name: Install the fuzz harness
        working-directory: migration/fuzz
        run: npm ci

      - name: Resolve the run-seed
        id: seed
        run: |
          SEED="${{ inputs.run_seed }}"
          if [ -z "$SEED" ]; then SEED="$(date -u +%Y%m%d)"; fi
          echo "run-seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "### Milestone fuzz shard" >> "$GITHUB_STEP_SUMMARY"
          echo "concerto-rust ref: \`${{ inputs.concerto_rust_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "run-seed: \`$SEED\` (${{ inputs.case_count }} cases, batch size 1000)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the fuzz shard
        id: fuzz
        env:
          FIXTURES_DIR: ${{ github.workspace }}/migration/oracle/fixtures
          CONCERTO_ENGINE_MODULE: ${{ steps.engine.outputs.pkg-dir }}/concerto-engine.cjs
        run: |
          mkdir -p migration/fuzz/results/milestone
          node migration/fuzz/bin/fuzz.js \
            --count "${{ inputs.case_count }}" \
            --batch-size 1000 \
            --run-seed "${{ steps.seed.outputs.run-seed }}" \
            --out migration/fuzz/results/milestone/run.json \
            --divergences migration/fuzz/results/milestone/divergences.jsonl \
            --expected migration/fuzz/results/milestone/expected-divergences.jsonl \
            --harness-errors migration/fuzz/results/milestone/harness-errors.jsonl

      # Writes triage-clusters.json into the same results dir (so the
      # artifact below always carries it) without failing the step itself —
      # the dedicated failing step after the upload is what gates the job,
      # so the report is uploaded either way. bin/check-milestone.js now
      # exits non-zero either for a new, unowned divergence cluster, or for
      # a run that looks broken rather than clean (its own `runHealth`
      # check — see its header comment); either way this step's output
      # captures that as `failed=1` and the job fails on it below.
      - name: Cluster this run's divergences against the baseline
        id: check
        if: always()
        run: |
          set +e
          node migration/fuzz/bin/check-milestone.js \
            --divergences migration/fuzz/results/milestone/divergences.jsonl \
            --baseline migration/fuzz/results/milestone-baseline/known-clusters.json \
            --out migration/fuzz/results/milestone/triage-clusters.json > /tmp/check-milestone.out 2>&1
          CODE=$?
          set -e
          cat /tmp/check-milestone.out
          cat /tmp/check-milestone.out >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then echo "failed=1" >> "$GITHUB_OUTPUT"; else echo "failed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the cluster report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-milestone-${{ steps.seed.outputs.run-seed }}
          path: migration/fuzz/results/milestone/
          if-no-files-found: error
          retention-days: 30

      - name: Fail on new divergence clusters or a broken run
        if: steps.check.outputs.failed == '1'
        run: |
          echo "::error::new, unowned divergence cluster(s) or a broken run — see the fuzz-milestone-${{ steps.seed.outputs.run-seed }} artifact's triage-clusters.json (runHealth field) and the 'Cluster this run's divergences against the baseline' step's log above"
          exit 1
